<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chrollo — Wyckoff Screener & Trading Journal Dashboard" />
    <title>Chrollo</title>
    <script>
      /* Apply the saved UI scale (or a first-run auto-fit) before React paints,
         so there is no scale flash on load. Mirrors src/app/appearance/uiScale.js — keep
         the constants in sync. Auto-fit = least shrink that unlocks another
         screener column for this viewport, never enlarging past 100%. */
      (function () {
        try {
          var KEY = 'chrollo:ui-scale';
          var STEPS = [0.85, 0.9, 0.95, 1, 1.05, 1.1, 1.15, 1.2, 1.25, 1.3];
          var saved = localStorage.getItem(KEY);
          var scale;
          if (saved != null && STEPS.indexOf(parseFloat(saved)) !== -1) {
            scale = parseFloat(saved);
          } else {
            var V = document.documentElement.clientWidth || window.innerWidth || 1536;
            var CHROME = 38, CARD = 480, GAP = 14, best = 1, bestCols = 0;
            for (var i = 0; i < STEPS.length; i++) {
              var s = STEPS[i];
              if (s > 1) continue;
              var cols = Math.max(1, Math.floor((V / s - CHROME + GAP) / (CARD + GAP)));
              if (cols > bestCols || (cols === bestCols && s > best)) { bestCols = cols; best = s; }
            }
            scale = best;
            localStorage.setItem(KEY, String(scale));
          }
          document.documentElement.style.setProperty('--ui-scale', String(scale));
        } catch (e) { /* leave the CSS default of 1 */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
