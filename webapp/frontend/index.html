<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chrollo — Wyckoff Screener & Trading Journal Dashboard" />
    <title>Chrollo</title>
    <script>
      /* Apply this screen's UI scale before React paints, so there is no scale
         flash on load. Mirrors src/app/appearance/uiScale.js (uiScale.test.js runs
         this script). The scale is remembered PER SCREEN ('chrollo:ui-scale@2560x1440');
         a screen with no manual choice is at 100%: the cards keep one size and a
         wider window shows more of them, so nothing is zoomed to fit. */
      (function () {
        try {
          var PREFIX = 'chrollo:ui-scale@';
          var STEPS = [0.85, 0.9, 0.95, 1, 1.05, 1.1, 1.15, 1.2, 1.25, 1.3];
          var sc = window.screen || {};
          var id = (sc.width > 0 && sc.height > 0) ? Math.round(sc.width) + 'x' + Math.round(sc.height) : 'default';
          var saved = localStorage.getItem(PREFIX + id);
          var scale = (saved != null && STEPS.indexOf(parseFloat(saved)) !== -1) ? parseFloat(saved) : 1;
          document.documentElement.style.setProperty('--ui-scale', String(scale));
        } catch (e) { /* leave the CSS default of 1 */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
