name: Quality

on:
  # Heavy CI runs on PRs (pre-merge gate) and pushes to main (post-merge gate) only.
  # Feature/scratch branches no longer burn minutes on every push — open a PR to get CI.
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref. Important now that verify-windows runs
# on a SINGLE self-hosted runner: without this, rapid pushes queue a backlog of
# obsolete commits that tie up the operator's machine (shared with the always-on
# ChrolloDashboard service). Only the latest commit on a ref needs to be gated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
      - name: Check Python correctness
        run: python -m ruff check .
      - name: Type-check core screener contracts
        run: python -m mypy
      - name: Check generated API contracts
        run: python -m tools.audits.api_contracts --check
      - name: Test response contracts, scan producers and shared browser fixture
        run: python -m pytest tests/contracts/test_api_responses.py tests/contracts/test_dashboard_wire.py tests/contracts/test_two_eyes_wire.py -q

  verify:
    runs-on: ubuntu-latest
    # A normal run is ~60 min since the final method landed (2026-09-26: pytest ~30 min,
    # the hermetic seed-recall replay ~15, the fired-window guards ~7). The 60-min cap it
    # replaced cancelled that run in its last, advisory step. This only force-cancels a
    # genuinely hung job, well below GitHub's 6h default.
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # Cache the pip wheel downloads (pandas/numpy/scipy/pyarrow/...) so the hosted
          # ubuntu job stops reinstalling the whole scientific stack from scratch each run.
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Compile Python
        run: python -m compileall core engine_alpha webapp/backend

      - name: Run Python tests
        run: python -m pytest

      # Headline shadow-output drift guard. Offline + deterministic: replays the
      # committed frozen fixture through the pipeline and fails on any canonical
      # output drift. (Also covered by tests/regression/test_regression_guards.py, but kept
      # as an explicit CI step so a drift is unmistakable in the logs.)
      - name: Shadow-output regression guard
        run: python -m tools.regression.shadow_diff --check

      # Negative-corpus precision guard. Offline + deterministic: replays the 16
      # committed junk charts (operator/dissection-labeled) through the reader door
      # on their 10-day fired window and fails on a fire day that is not PINNED in
      # tests/baselines/negative_corpus_baseline.json (47 pinned days over 15 charts,
      # GOOD silent), on a crash, or on a missing frame. This is the precision
      # direction the two guards above cannot see - the shadow fixture holds only
      # previously-firing tickers and seed-recall only fails on lost winners. (Also
      # covered by tests/regression/test_negative_corpus.py, but kept as an explicit
      # CI step so a precision regression is unmistakable in the logs.)
      - name: Negative-corpus precision guard
        run: python -m tools.regression.negative_corpus --check

      # Hermetic seed-recall drift guard. Offline + deterministic, HARD gate.
      #
      # Replays the committed frozen fixture (tests/baselines/seed_recall_fixture
      # .parquet -- every active seed winner's OHLCV + SPY) through the seed twin
      # `_evaluate_at_date` and fails on any known winner the current engine no
      # longer re-finds. Sibling of the shadow guard above, but over the curated
      # winners via a DIFFERENT code path (the -WINDOW_BACK/+WINDOW_FWD scan-back).
      # No network, so unlike the advisory step below it can truly red the build.
      #
      # This is the SOLE full replay: it runs the eval chain ~700x (a few minutes),
      # too slow for the default pytest suite, so it is NOT a pytest test. Instead
      # tests/regression/test_seed_recall_hermetic.py guards the plumbing cheaply (fixture +
      # baseline committed, frozen baseline mirrors the live recall, guard bites),
      # and this step is the hard offline gate that actually re-runs the engine.
      - name: Hermetic seed-recall regression guard
        run: python -m core.archive.seed_recall --hermetic-check

      # Operator-marks acceptance ratchet. Offline + deterministic, HARD gate.
      # Replays the committed EC-7 must-fire marks corpus (docs/marks + the frozen
      # tests/baselines/marks_corpus.parquet fixture) through the engine and fails if a
      # pinned operator mark stops firing. Sibling of the guards above but over a DIFFERENT
      # corpus (operator ground truth, not seed winners); ~35s, hermetic (committed
      # fixture + baseline only, no network). pytest's test_marks_corpus.py checks the
      # plumbing cheaply under a monkeypatched evaluator; THIS step runs the real replay,
      # which is why it is a dedicated CI step and not a pytest test.
      - name: Operator-marks acceptance guard
        run: python -m tools.regression.marks_corpus --check

      # Reader pin. Offline + deterministic, HARD gate, ~1 min.
      # Reads 105 committed fixture charts (the 52 sealed marks, the 16 junk
      # charts, and all 37 shadow charts INCLUDING the ones that do not fire)
      # with the alpha reader itself (engine_alpha.two_eyes.read) and fails on any
      # change to what it SAYS about a chart: the boxes, the LPS, the state word,
      # the events, the grade letter and score, the trail's stage words. It is the
      # only guard that can see that: shadow_diff freezes nine canonical fields of
      # the fires alone and marks_corpus compares FIRES, so a change that rewrites
      # every event while keeping fires and scores identical passes both. The
      # engine_config_version stamp is compared as an ADVISORY only (a declared
      # epoch rotates it on purpose). Zero diffs is the fold acceptance; a ruled
      # reading change recaptures at its own seam commit (EC-29), never mid-fold.
      # Also covered by tests/regression/test_reader_pin.py - kept as an explicit
      # step, like the guards above, so a reading drift is unmistakable in the logs.
      - name: Reader pin
        run: python -m tools.regression.reader_pin --check

      # Seed-recall guard, FRESH-DATA basis. ADVISORY-ONLY on CI, by design.
      #
      # The committed baseline (tests/baselines/seed_recall_baseline.json) is
      # basis=fresh, so `--check` routes through the FRESH engine guard: it
      # re-downloads each seed winner's OHLCV and re-evaluates it live. That
      # means this step needs the network AND live vendor data, neither of
      # which a CI runner is guaranteed to have. On a network-less/rate-limited
      # runner it will therefore go red on the FETCH, not on any real recall
      # regression -- so it is continue-on-error and MUST stay that way
      # (removing it would red every build). It is kept wired + visible so a
      # local/manual run surfaces in the logs, but it does NOT gate the build.
      #
      # The HARD recall gate is now the "Hermetic seed-recall regression guard"
      # step above (offline, deterministic): it catches a real seed-winner drop
      # on FROZEN inputs and reds the build. This fresh step adds live-vendor
      # drift visibility on top (data the frozen fixture cannot see), which is
      # why it is kept despite being advisory.
      #
      # Run locally against real data:
      #   python -m core.archive.seed_recall --fresh-check  (network re-eval; matches the committed basis=fresh baseline)
      #   python -m core.archive.seed_recall --check        (uses the captured baseline basis; fresh baseline => same fresh re-eval)
      - name: Seed-recall regression guard (advisory; needs network/live data)
        continue-on-error: true
        run: python -m core.archive.seed_recall --check

  # The frontend gate is its own job, beside the Python one. On 2026-09-26 the Python job
  # hit its time cap before it reached these steps, so that push went out with the frontend
  # ungated. As a separate job it reports in a few minutes, whatever the Python job does.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: webapp/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: webapp/frontend
        run: npm run lint

      - name: Test frontend
        working-directory: webapp/frontend
        run: npm run test

      - name: Build frontend
        working-directory: webapp/frontend
        run: npm run build

      - name: Install browser for UI checks
        working-directory: webapp/frontend
        run: npx playwright install --with-deps chromium

      - name: Test built frontend in the browser
        working-directory: webapp/frontend
        run: npm run test:e2e

      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            webapp/frontend/playwright-report/
            webapp/frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Prod is the Windows / Python 3.14 NSSM service; an ubuntu-only gate proved
  # blind to Windows-only classes (the cp1252 stdio-encoding crash under the
  # service). This job repeats the compile + pytest gate on the prod platform
  # and version, including the service-cwd boot smoke in tests/backend/test_service_boot.py.
  verify-windows:
    # Runs on a SELF-HOSTED runner on the operator's own Windows box (the prod
    # platform) — free unlimited minutes + true prod-parity vs the paid, 2x-billed
    # windows-latest hosted runner it replaces. SAFETY: this is safe only while the
    # repo is PRIVATE; if it is ever made public, REMOVE this runner first — a fork
    # PR could otherwise execute arbitrary code on the machine. The runner must be
    # registered with the custom label `chrollo-win` (see docs/deploy.md setup).
    runs-on: [self-hosted, chrollo-win]
    # Cap a hung step: a single shared self-hosted runner (also carrying the always-on
    # ChrolloDashboard service) must not be pinned for GitHub's 6h default. `concurrency`
    # only cancels superseded runs, never a lone stuck one. The 2026-09-26 run took 29m44s,
    # 16 seconds inside the old 30-min cap, once the final method's tests landed.
    timeout-minutes: 45
    # Uses a machine-wide Python 3.14 installed on the runner box (on the system PATH), NOT
    # actions/setup-python — setup-python's per-run installer fails under the runner's NETWORK
    # SERVICE account, and the operator's own 3.14 is a per-user install under %LOCALAPPDATA%
    # that the service account cannot read. Same version as prod, so it still catches
    # Windows/3.14-specific breakage. A throwaway venv keeps CI from mutating any environment's
    # site-packages. See docs/deploy.md §6 for the machine-wide-Python prerequisite.
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Python version
        run: python --version

      - name: Create isolated virtualenv
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Compile Python
        run: .\.venv\Scripts\python.exe -m compileall core engine_alpha webapp/backend

      - name: Run Python tests
        run: .\.venv\Scripts\python.exe -m pytest
