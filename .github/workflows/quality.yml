name: Quality

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall core webapp/backend

      - name: Run Python tests
        run: python -m pytest

      # Headline shadow-output drift guard. Offline + deterministic: replays the
      # committed frozen fixture through the pipeline and fails on any canonical
      # output drift. (Also covered by tests/test_regression_guards.py, but kept
      # as an explicit CI step so a drift is unmistakable in the logs.)
      - name: Shadow-output regression guard
        run: python -m tools.shadow_diff --check

      # Hermetic seed-recall drift guard. Offline + deterministic, HARD gate.
      #
      # Replays the committed frozen fixture (tests/baselines/seed_recall_fixture
      # .parquet -- every active seed winner's OHLCV + SPY) through the seed twin
      # `_evaluate_at_date` and fails on any known winner the current engine no
      # longer re-finds. Sibling of the shadow guard above, but over the curated
      # winners via a DIFFERENT code path (the -WINDOW_BACK/+WINDOW_FWD scan-back).
      # No network, so unlike the advisory step below it can truly red the build.
      #
      # This is the SOLE full replay: it runs the eval chain ~700x (a few minutes),
      # too slow for the default pytest suite, so it is NOT a pytest test. Instead
      # tests/test_seed_recall_hermetic.py guards the plumbing cheaply (fixture +
      # baseline committed, frozen baseline mirrors the live recall, guard bites),
      # and this step is the hard offline gate that actually re-runs the engine.
      - name: Hermetic seed-recall regression guard
        run: python -m core.archive.seed_recall --hermetic-check

      # Seed-recall guard, FRESH-DATA basis. ADVISORY-ONLY on CI, by design.
      #
      # The committed baseline (tests/baselines/seed_recall_baseline.json) is
      # basis=fresh, so `--check` routes through the FRESH engine guard: it
      # re-downloads each seed winner's OHLCV and re-evaluates it live. That
      # means this step needs the network AND live vendor data, neither of
      # which a CI runner is guaranteed to have. On a network-less/rate-limited
      # runner it will therefore go red on the FETCH, not on any real recall
      # regression -- so it is continue-on-error and MUST stay that way
      # (removing it would red every build). It is kept wired + visible so a
      # local/manual run surfaces in the logs, but it does NOT gate the build.
      #
      # The HARD recall gate is now the "Hermetic seed-recall regression guard"
      # step above (offline, deterministic): it catches a real seed-winner drop
      # on FROZEN inputs and reds the build. This fresh step adds live-vendor
      # drift visibility on top (data the frozen fixture cannot see), which is
      # why it is kept despite being advisory.
      #
      # Run locally against real data:
      #   python -m core.archive.seed_recall --fresh-check  (network re-eval; matches the committed basis=fresh baseline)
      #   python -m core.archive.seed_recall --check        (uses the captured baseline basis; fresh baseline => same fresh re-eval)
      - name: Seed-recall regression guard (advisory; needs network/live data)
        continue-on-error: true
        run: python -m core.archive.seed_recall --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: webapp/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: webapp/frontend
        run: npm run lint

      - name: Test frontend
        working-directory: webapp/frontend
        run: npm run test

      - name: Build frontend
        working-directory: webapp/frontend
        run: npm run build

  # Prod is the Windows / Python 3.14 NSSM service; an ubuntu-only gate proved
  # blind to Windows-only classes (the cp1252 stdio-encoding crash under the
  # service). This job repeats the compile + pytest gate on the prod platform
  # and version, including the service-cwd boot smoke in tests/test_service_boot.py.
  verify-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall core webapp/backend

      - name: Run Python tests
        run: python -m pytest
